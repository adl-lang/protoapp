[package]
name = "adl"
version = "0.1.0"
edition = "2021"
description = "ADL generated code for the protoapp application"

[dependencies]
adl-derive = { workspace = true }
adl_rt = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sea-query = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true }

[dev-dependencies]
# Only to drive the generated client's futures in the unit tests below; the
# crate itself is runtime agnostic.
tokio = { version = "1.27.0", features = ["rt", "macros"] }
