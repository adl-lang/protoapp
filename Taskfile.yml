version: "3"

includes:
  rust:
    taskfile: ./rust
    dir: ./rust

tasks:
  dev:
    desc: Bring up the whole local dev system (postgres, server, ui) under process-compose
    interactive: true
    cmds:
      - process-compose up {{.CLI_ARGS}}

  genadl:
    desc: Regenerate rust, typescript and sql code from the ADL sources
    cmds:
      - tasks/genadl.sh

  build-server-image:
    desc: Build the server docker image
    dir: rust
    cmds:
      - docker build --file server/Dockerfile --tag protoapp-server:latest .

  build-ui-image:
    desc: Build the ui docker image
    dir: ts
    cmds:
      - docker build --file ui/Dockerfile --tag protoapp-ui:latest .
