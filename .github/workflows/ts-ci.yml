name: TypeScript CI
on:
  push:
    branches: [master, main]
  pull_request:
    paths:
      - "ts/**"

jobs:
  lint-and-check-workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Install deps
        working-directory: ./ts
        run: nix develop .. -c pnpm install

      - name: Check
        working-directory: ./ts
        run: nix develop .. -c pnpm run -r check
